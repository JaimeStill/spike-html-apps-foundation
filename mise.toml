# Adapted from spike-html-packages-foundation (5dd8a58): mise.toml, renamed.
# Tasks never install a missing tool; mise run install is the one task that reads the network.
[settings]
task.run_auto_install = false

# The foundation's toolchain.
[tools]
actionlint = "1.7.12"
node = "26.13.0"
pnpm = "12.16.1"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump.
[tools."http:chrome-headless-shell"]
version = "156.0.8078.80"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:547dcd374e02961bf998f6046a267644f8502225c36bb78ca307dab32a0b3eb4", size = "126922702" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, and actionlint"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

[tasks."lint:eslint"]
description = "Lint with ESLint, the layer's imports included"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.types]
description = "Type-check the sources and the suite with tsc"
depends = ["types:src", "types:test"]

[tasks."types:src"]
description = "Type-check the sources with tsc"
run = "tsc --noEmit -p ."

# The suite imports the package's own exports, which resolve to dist/'s declarations.
[tasks."types:test"]
description = "Type-check the suite and the capture description with tsc, under tsconfig.test.json"
depends = ["build"]
run = "tsc -p tsconfig.test.json"

[tasks.build]
description = "Build src/ into dist/: tsc's emit, with the .css and handwritten .d.ts beside it"
run = "scripts/build.sh"

[tasks."test:unit"]
description = "Run the unit tier on the sources, the lint, and a pack of the build"
depends = ["preflight", "build"]
run = "node --test 'test/unit/*.test.ts'"

[tasks."test:browser"]
description = "Run the browser tier on dist/ in the pinned chrome-headless-shell"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"

[tasks.check]
description = "Run every check; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.install]
description = "Install the pins and node_modules; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.demo]
description = "Serve the tools, profiles, theme, unit, keys, format, and hooks demo pages, on dist/, on the loopback address"
depends = ["build"]
run = "node scripts/demo.js"

# Never a dependency of check: a reviewer's look at the pages, not a test.
[tasks.screenshots]
description = "Capture the tools page, keys help, the theme menu, and the hooks page light and dark, inline in kitty: at the defaults, or --palette/--space/--type <name>, or --all for every profile; --page <name> (repeatable) and --scheme light|dark narrow it; --output directory|browser and --dir <path> choose where they go; --keep leaves the captures"
depends = ["preflight browser", "build"]
# The tooling's bin over the capture description; the task's arguments follow it, with or without
# a leading --.
# raw: with dependencies, mise prefixes a task's output through a pipe; icat needs the terminal.
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) pnpm exec spike-html-apps-screenshots scripts/screenshots.config.ts"

[tasks.currency]
description = "Report every mise tool, package.json pin, action pin, and the tooling's tag behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
