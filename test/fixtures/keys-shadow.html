<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>keys shadow-root fixture</title>
    <link rel="stylesheet" href="../../dist/page.css" />
    <script type="module" src="../../dist/keys.js"></script>
  </head>
  <body>
    <h1>keys shadow-root fixture</h1>
    <p>T clicks the Theme button. Each component keeps an input, a textarea, and a contenteditable in its open shadow root; the panel keeps a field component in its own, two shadow roots deep. A key typed in any of them types, and binds nothing.</p>
    <p><button type="button" data-keys="t" data-log="t">Theme <kbd>T</kbd></button></p>
    <x-fields id="fields"></x-fields>
    <x-panel id="panel"></x-panel>
    <script type="module">
      // x-fields: the three kinds of field, in an open shadow root.
      customElements.define(
        "x-fields",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML = `
              <label>Text <input type="text" id="input" /></label>
              <label>Notes <textarea id="textarea"></textarea></label>
              <p id="editable" contenteditable="true"></p>`;
          }
        },
      );
      // x-panel: a component inside a component, its fields two shadow roots deep.
      customElements.define(
        "x-panel",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML = `<x-fields id="inner"></x-fields>`;
          }
        },
      );
      // log records each action a binding runs, in order, for the tests and the reader.
      window.log = [];
      document.addEventListener("click", (event) => {
        const name = event.target.closest?.("[data-log]")?.dataset.log;
        if (name) window.log.push(name);
      });
    </script>
  </body>
</html>
