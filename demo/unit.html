<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>foundation unit</title>
    <!-- The lean page entry composed with one built-in unit, Primer: its sheet linked after
         page.css, which it follows in the color sub-layer, and its registration module imported
         beside register.js, so the theme menu lists flexoki and primer, and no other color. A
         profile from outside the package joins the same way. Its modules run served only: mise
         run demo. -->
    <link rel="stylesheet" href="../dist/page.css" />
    <link rel="stylesheet" href="../dist/profiles/color/primer.css" />
    <script type="module" blocking="render" src="../dist/register.js"></script>
    <script type="module" blocking="render" src="../dist/profiles/color/primer.js"></script>
    <script type="module" blocking="render" src="../dist/preferences.js"></script>
    <script type="module" src="../dist/keys.js"></script>
  </head>
  <body>
    <main>
      <h1>Foundation unit</h1>
      <p>
        <button type="button" commandfor="theme" command="--open" data-keys="t">
          Theme <kbd>T</kbd>
        </button>
      </p>
      <p>
        This page links page.css and the Primer unit alone. The menu's Color row lists Flexoki,
        the lean default, and Primer, the unit; space and type hold their defaults only.
      </p>
      <p>
        <a class="button" href="#theme">A link button</a>
        <button class="button-blue" type="button">Deploy</button>
        <button class="button-red" type="button">Delete</button>
        <button class="button-green" type="button" disabled>Disabled</button>
      </p>
      <div class="field">
        <label for="branch">Branch</label>
        <input id="branch" class="field-grow" type="text" value="main" />
      </div>
      <table class="table-striped">
        <thead>
          <tr>
            <th scope="col">Run</th>
            <th scope="col">Status</th>
            <th scope="col">Time</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1204</td>
            <td>passed</td>
            <td>2m 14s</td>
          </tr>
          <tr>
            <td>1205</td>
            <td>failed</td>
            <td>48s</td>
          </tr>
        </tbody>
      </table>
    </main>
    <sl-theme-menu id="theme"></sl-theme-menu>
  </body>
</html>
